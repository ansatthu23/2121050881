<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 7- JS</title>
</head>
<body>
    <!-- Internal JavaScirpt -->
     <script>
        // có thể thêm mã nguồn html vào trong JS
        // lưu ý: html phải đặt trong cặp dấu " "
        document.writeln("Hello <br> Word!");

        var tenSinhVien = "Hoang An";
        var tuoi = 22;
        document.writeln(tenSinhVien + "<br>" + tuoi + "<br>")

        var soThuNhat = 11;
        var soThuHai = 5;
        // + - * /
        // % chia lấy phần dư
        var ketQua = soThuNhat % soThuHai;
        document.writeln("Kết quả là " + ketQua);

        //++ --
        document.writeln(++soThuNhat);
        document.writeln(--soThuNhat);
        
        //+= -= /= %=
        //Tương đương: soThuNhat=soThuNhat + soThuHai
        soThuNhat += soThuHai;
        document.writeln(soThuNhat);

        // Kiểu dữ liệu
        // String
        // Number Số
        // boolean(true/false)

        var a = "10";
        var b = "5.5" ;
        // Chuyển String => number dùng: parseInt()
        // parseInt: số thực, parseFloat: số thập phân
        var tong= parseInt(a) + parseFloat(b);
        document.writeln(tong);

        // String
        document.writeln("<br>");
        // kiểm tra độ dãi chuỗi length
        document.writeln(tenSinhVien.length);
        // Nối chuỗi +

        // Kiểm tra tồn tại
        // indexOf tìm vị trí xuất hiện đầu tiên (có - vị trí/không có -1)
        document.writeln("<br>");
        document.writeln(tenSinhVien.indexOf("a"));

        // includes kiểm tra xem từ có trong chuỗi không? có = true/ k = false
        document.writeln("<br>");
        document.writeln(tenSinhVien.includes("c"));

        //replace (thay thế chuỗi)
        document.writeln("<br>");
        document.writeln(tenSinhVien.replace("Hoang", "Nguyen"));

        //kiểm tra ký tự bắt đầu
        document.writeln("<br>");
        document.writeln(tenSinhVien.startsWith("Hoang"));

        //Viết in hoa
        document.writeln("<br>");
        document.writeln(tenSinhVien.toUpperCase());

        //Viết in thường
        document.writeln("<br>");
        document.writeln(tenSinhVien.toLowerCase());

        //number
        //kiểm tra dữ liệu có phải số hay không
        // document.writeln()
        
        //date
        var homNay = new Date();
        document.writeln("<br>");
        document.writeln(homNay);

        // khai báo ngày cụ thể định dạng tháng/ngày/năm
        var ngay = new Date("10/20/2026");
        document.writeln("<br>");
        document.writeln(ngay);

        //lấy năm
        var nam = homNay.getFullYear();
        document.writeln("<br>");
        document.writeln(nam);

        //lấy tháng
        var thang = homNay.getMonth();
        document.writeln("<br>");
        document.writeln(thang);

        //lấy ngày
        var ngay = homNay.getDate();
        document.writeln("<br>");
        document.writeln(ngay);

        //lấy thứ
        var thu = homNay.getDay();
        document.writeln("<br>");
        document.writeln(thu);

        var namSinhAn=nam-tuoi;
        document.writeln("<br>");
        document.writeln("An sinh năm " + namSinhAn);

        //mảng (array)
        var mangSo = [1,2,3,4,5];
        var mangTen = ["Thuy","Mai", "Tuan"];
        var thongTin = ["Thuy", 21, false];

        document.writeln("<br>");
        document.writeln(mangSo[2]);
        document.writeln("<br>");
        document.writeln(mangTen[1]);
        document.writeln("<br>");
        document.writeln(thongTin[0]);

        //kiểm tra độ dài mảng length
        document.writeln("<br>");
        document.writeln(mangSo.length);

        //Gộp mảng concat
        var mang = mangSo.concat(mangTen, thongTin);
        document.writeln(mang);

        //join
        document.writeln("<br>");
        document.writeln(mangSo.join());

        //pop lấy ra số cuối cùng
        document.writeln("<br>");
        document.writeln(mangSo.pop());

        //push 
        document.writeln("<br>");
        mangSo.push(6);
        document.writeln(mangSo);

        //reverse
        document.writeln("<br>");
        document.writeln(mangSo.reverse());

        // var soThuNhat = 10
        // var soThuHai = 5
        // == so sánh =
        // >
        // <
        // >=
        // >=   
        document.writeln("<br>");
        document.writeln(soThuNhat);
        document.writeln(soThuNhat >=10);

        // var soThuNhat = 16
        // var soThuHai = 5
        var c=10;
        var d = 5;
        // true & true = true
        // false & true = false
        // false & false = false
        // && ||
        // false & false
        document.writeln("<br>");
        document.writeln((soThuNhat>soThuHai)&&(c<d));

        // true || false =
        document.writeln("<br>");
        document.writeln((soThuNhat>soThuHai)||(c<d));

        // var thu=homNay.getDay();
        document.writeln(thu);
        if(thu==1){
            document.writeln("hôm nay là thứ 6")
        }
        else{
            document.writeln("hôm nay không phải là chủ nhật")
        }

        var diem = 10;
        if(diem<4){
            document.writeln("<br>");
            document.writeln("F");
        }
        else{
            document.writeln("<br>");
            document.writeln("qua môn")
        }

        if(thu==1){
            document.writeln("hôm nay là thứ 6")
        }
        else if(thu==5){
            document.writeln("hôm nay là thứ 6")
        }
        else{
            document.writeln("hôm nay không phải là chủ nhật")
        }
     </script>

     <!-- External JavaScript -->
     <!-- <script src="script.js"></script> -->
</body>
</html>
