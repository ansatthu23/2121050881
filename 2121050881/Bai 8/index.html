<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 9 - JS</title>
</head>
<body>
    <div>
        Họ và tên: <input type="text" id="hoVaTen">
    </div>
    <div>
        <button onclick="xinChao()">Xin chào</button>
    </div>
    <div>
        kết quả: <input type="text" id="ketQua">
    </div>
    <h1>Tính tổng</h1>
    <div>
        Số thứ nhất: <input type="number" id="soThuNhat">
    </div>
    <div>
        Số thứ hai: <input type="number" id="soThuHai">
    </div>
    <div>
        <button onclick="tinhTong()">Tính tổng</button>
    </div>
    <div>
        kết quả: <input type="number" id="tong">
    </div>

    <script>
        function tinhTong(){
            var soThuNhat=document.getElementById("soThuNhat").value;
            var soThuHai=document.getElementById("soThuHai").value;
            document.getElementById("tong").value=parseFloat(soThuNhat)+parseFloat(soThuHai);
        }



        // Function
        // để tạo function dùng cú pháp
        // hàm ko có tham số
        // function + tên(){}
        function xinChao(){
            var ten=document.getElementById("hoVaTen").value;
            document.getElementById("ketQua").value="xin chào"+ten;
        }
        
        // gọi hàm
        xinChao();

        //2: hàm có tham số
        //function + tên(tham số){}
        // lưu ý: các tham số ngăn cách nhau = dấu ,)
        function xinChao2(ten,tuoi){
            document.write("Xin chào" + ten + tuoi);
        }

        xinChao2("Thủy",19);

        // sửa hàm xinChao2 in ra xin chào + ten + tuổi

        // tạo hàm tính chu vi hình chữ nhật
        function chuViHinhChuNhat(dai,rong){
            document.write((dai + rong)/2);
        }

        chuViHinhChuNhat(6,7);

        var danhSachSinhVien = ["Thủy","Dương","Việt", "Huệ","Thắng"];
        for(var i=0;i<danhSachSinhVien.length;i++){
            // document.writeln("<br>"+"Xin chào"+ danhSachSinhVien[i]);
            if(danhSachSinhVien[i]!="Việt"){
                document.writeln("<br>"+"Xin chào"+ danhSachSinhVien[i]);
            }
        }
        
        //hàm có tham số
        // danh sách sinh viên, tên sinh viên cần tìm 
        // đầu ra: nếu có thì in ra có sinh viên / nếu ko: không có sinh viên
        var danhSachSinhVien = ["Thủy","Dương","Việt", "Huệ","Thắng"];
        function danhSach(ds, ten){
            var coSinhVien = false;
            for(var i =0;i<danhSachSinhVien.length;i++){
                if(ds[i]==ten){
                coSinhVien = true;
            }
            if(coSinhVien == true){
                document.write("<br> có sinh viên"+ten+" trong danh sách")
            }
            else{
                document.write("<br> ko có sinh viên"+ten+" trong danh sách")
            }
            }
        }

        danhSach(danhSachSinhVien[i],"Dương");

    </script>
</body>
</html>
