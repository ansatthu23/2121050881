<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .khoi-1{
            background-color: red;
        }
        .khoi-2{
            /* margin truyền 1 giá trị thì sẽ cách xung quanh = giá trị đó */
            /* 2 giá trị: Giá trị đầu(trên dưới), giá trị 2(trái, phải) */
            /* 4 giá trị: Thứ tự trên, phải, dưới, trái */
            background-color: green;
            margin: 10px 50px 100px 200px;
        }.khoi-3{
            background-color: yellow;
            padding: 10px 50px 100px 200px;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="khoi-1">Khối 1</div>
    <div class="khoi-2">Khối 1</div>
    <div class="khoi-3">Khối 1</div>

    <h2 style="color: green;">Internal Style</h2>
    <!-- nếu là id sử dụng dấu #  + tên id -->
    <!-- ví dụ ở dưới: #tieude-1 -->
    <h2 id="tieude-1">Internal Style</h2>
    <!-- nếu là class sử dụng . + tên id -->
    <!-- ví dụ ở dưới: .tieude-2 -->
    <h3 class="tieude-2">Internal Style</h3>

    <div>Web 4</div>
    <div class="web4">Web 4</div>

    <h1>
        Margin, Padding, Display
    </h1>

    <!-- display: flex rồi thì phải đi với 
     justify-content (căn theo chiều ngang) flex-start, flex-end, center, space-between, space-around
     align-items (căn theo chiều dọc) flex-start, flex-end, center, baseline, stretch
     flex-direction (xếp hàng)
        -->
    
</body>
</html>
